name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The engine moves on its own main; catch a break within a day.
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The engine the programs are written for
        id: engine
        run: |
          rev=$(git ls-remote https://github.com/varpulis/varpulis refs/heads/main | cut -f1)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cargo/bin/varpulis
          key: varpulis-${{ steps.engine.outputs.rev }}
      - name: Build varpulis
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/varpulis/varpulis --rev ${{ steps.engine.outputs.rev }} varpulis-cli
      - run: pip install -e '.[test]'
      - name: Tests, the engine ones included
        run: VARPULIS_BIN=~/.cargo/bin/varpulis pytest -rs
      - name: The engine tests really ran
        run: VARPULIS_BIN=~/.cargo/bin/varpulis pytest -q tests/test_on_varpulis.py | tee out.txt && ! grep -q skipped out.txt
