
title: PsExec Execution
id: 730fc21b-eaff-474b-ad23-90fd265d4988
status: stable
description: Detects PsExec usage by matching the binary filename
references:
    - https://docs.microsoft.com/en-us/sysinternals/downloads/psexec
author: Security Demo
date: 2024/01/01
tags:
    - attack.execution
    - attack.t1569.002
    - attack.lateral_movement
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        - Image|endswith: '\PsExec.exe'
        - Image|endswith: '\PsExec64.exe'
        - OriginalFileName: 'psexec.c'
    condition: selection
falsepositives:
    - Legitimate admin use of PsExec
level: high

